<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>miku-md2docx Converter</title>
    <style>
      :root {
        color-scheme: light;
        --border: #c7cdd8;
        --text: #202124;
        --muted: #5f6368;
        --accent: #0b57d0;
        --surface: #ffffff;
        --page: #f6f7f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--page);
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
      }
      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
      }
      main.wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
        gap: 24px;
      }
      section {
        min-width: 0;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 16px;
      }
      label {
        display: block;
        margin: 0 0 16px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 8px;
        font: inherit;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0 14px;
        font: inherit;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        border-color: var(--border);
        background: #e8eaed;
        color: var(--muted);
        cursor: default;
      }
      #statusOutput {
        min-height: 24px;
        color: var(--muted);
      }
      pre {
        min-height: 280px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (max-width: 820px) {
        main.wrap {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>miku-md2docx</h1>
        <p class="subtitle">Convert local Markdown into an editable DOCX document.</p>
      </div>
    </header>
    <main class="wrap">
      <section class="panel">
        <h2>Input</h2>
        <label>
          Markdown
          <input id="markdownInput" type="file" accept=".md,.markdown,text/markdown,text/plain">
        </label>
        <label>
          Image assets
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
        </label>
        <div class="actions">
          <button id="convertButton" type="button">Convert</button>
          <button id="downloadButton" type="button" disabled>Download DOCX</button>
          <span id="statusOutput">Ready.</span>
        </div>
      </section>
      <section class="panel">
        <h2>Summary</h2>
        <pre id="summaryOutput"></pre>
      </section>
    </main>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
